Form').scrollIntoView({behavior:'smooth',block:'start'})};$('#archiveToggle').onclick=()=>{const list=$('#archiveList'),opening=list.hidden;list.hidden=!opening;$('#archiveToggle').textContent=opening?'過去のプランを閉じる':'過去のプランを見る'};$('#close').onclick=close;$('#modal').onclick=e=>{if(e.target.id==='modal')close()};$('#photo').onchange=async e=>{if(e.target.files[0]){pending=await compress(e.target.files[0]);preview(pending)}e.target.value=''};$('#removePhoto').onclick=()=>{pending=null;$('#preview').hidden=true};
function showStamp(h,date){const stamp=$('#largeStamp'),overlay=$('#overlay');stamp.className=`stamp ${h.stamp.shape}`;stamp.innerHTML=`<b>${h.stamp.word}</b><em>${h.stamp.icon}</em><small>${new Date(date+'T00:00:00').toLocaleDateString('ja-JP')}</small>`;stamp.style.cssText=`--c:${h.stamp.color};--r:-7deg`;overlay.style.setProperty('--stamp-color',h.stamp.color);overlay.hidden=false;void stamp.offsetWidth;stamp.classList.add('impact-stamp')}
$('#save').onclick=async()=>{if(!active||!activePlan)return;const date=$('#date').value||new Date().toISOString().slice(0,10),id=crypto.randomUUID?crypto.randomUUID():`visit-${Date.now()}`,photoId=pending?`tea-${id}`:'';if(pending)await photoPut(photoId,pending);const visit={id,hotelId:active.id,venueId:activePlan.venueId,planId:activePlan.id,date,comment:$('#comment').value.trim(),photoId,createdAt:new Date().toISOString()};visits.push(visit);localStorage.setItem(VISIT_KEY,JSON.stringify(visits));const h=active;showStamp(h,date);close();render().catch(()=>toast('記録は保存されました。画面を再読み込みしてください'))};$('#overlay').onclick=()=>$('#overlay').hidden=true;render();
</script></body></html>
