</style></head><body><main class="app"><header><span class="eyebrow">東京のラウンジをめぐる小さな旅</span><h1>東京アフタヌーンティーパスポート</h1><p>一杯のお茶から始まる、東京をめぐる小さな旅。</p><button id="journeySelect" class="journey-select" type="button"><small>JOURNEY</small><b><span id="journeyName">MY JOURNEY</span> ▾</b></button><div class="progress"><b id="total">0 / 10</b><div class="bar"><i id="bar"></i></div><span class="eyebrow">集めたスタンプ</span></div><button id="nextTeaBanner" class="next-tea-banner" type="button"><small>次に行く</small><b id="nextTeaBannerText"></b></button></header>
