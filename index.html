<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鶯谷コンプリートマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg:#f3f1ec; --panel:#fff; --ink:#202124; --muted:#6b7280;
  --accent:#d43d49; --done:#2f7d59; --border:#d8d8d8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
.app{max-width:1500px;margin:auto;padding:10px}
header{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:13px 15px;margin-bottom:9px}
h1{margin:0 0 4px;font-size:22px}
.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.progress-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.progress{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden;flex:1}
.progress span{display:block;height:100%;width:0;background:var(--done);transition:.2s}
.count{font-weight:800;min-width:80px;text-align:right}
.layout{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(340px,.9fr);gap:9px;align-items:stretch}
.map-panel,.list-panel{background:var(--panel);border:1px solid var(--border);border-radius:15px;overflow:hidden}
#map{height:850px;width:100%}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border-bottom:1px solid var(--border)}
.list-head h2{font-size:17px;margin:0}
.actions{display:flex;gap:6px}
button{border:0;border-radius:8px;padding:7px 9px;font-weight:700;cursor:pointer}
#resetBtn{background:#ececec} #fitBtn{background:#222;color:white}
.list{padding:7px;max-height:793px;overflow:auto}
.row{
  display:grid;
  width:100%;
  grid-template-columns:34px 1fr 28px;
  gap:8px;
  align-items:start;
  padding:9px 7px;
  border-bottom:1px solid #ececec;
  border-radius:8px
}
.row:hover{background:#f7f7f7}
.num{width:30px;height:30px;border:2px solid var(--accent);color:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.row.done{background:#edf7f1}
.row.done .num{background:var(--done);border-color:var(--done);color:white}
.row.done .name{color:var(--done);text-decoration:line-through}
.name{font-weight:700;font-size:13px;line-height:1.25}
.addr{font-size:10px;color:var(--muted);margin-top:2px}
.comment-title{
  margin-top:9px;
  font-size:12px;
  font-weight:900;
  color:#2f7d59;
}
.comment{
  width:100%;
  min-height:58px;
  margin-top:7px;
  padding:7px 8px;
  resize:vertical;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fffdf2;
  color:var(--ink);
  border:2px solid #d7b84a;
  font:inherit;
  font-size:12px;
  line-height:1.4
}
.comment:focus{
  outline:2px solid rgba(47,125,89,.25);
  border-color:var(--done)
}
.comment::placeholder{color:#9ca3af}
.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
.detail-field{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:800;color:#4b5563}
.detail-field input,.detail-field select{width:100%;min-height:36px;padding:6px 7px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:12px}
.facility-title{margin-top:9px;font-size:11px;font-weight:900;color:#4b5563}
.facilities{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.facility-chip{position:relative}.facility-chip input{position:absolute;opacity:0;pointer-events:none}.facility-chip span{display:block;padding:5px 8px;border:1px solid #cbd5e1;border-radius:999px;background:#f8fafc;color:#475569;font-size:11px;font-weight:800;cursor:pointer;user-select:none}
.facility-chip input:checked+span{background:#e3f5ea;border-color:var(--done);color:#25633f}
.save-note{min-height:16px;margin-top:4px;color:#6b7280;font-size:10px}.save-note.saved{color:var(--done)}.save-note.error{color:#a22}
#backupBtn{background:#fff;border:1px solid #64748b;color:#334155}
@media(max-width:520px){.detail-grid{grid-template-columns:1fr 1fr}.detail-field:first-child{grid-column:1/-1}}
.chk{width:21px;height:21px;accent-color:var(--done);margin-top:4px}
.status{padding:8px 13px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:#fafafa}
.marker-number{width:30px;height:30px;border-radius:50%;background:var(--accent);border:2px solid white;color:white;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 2px 6px #0005}
.marker-number.done{background:var(--done)}
.leaflet-div-icon{background:transparent;border:0}
.note{margin-top:9px;background:#fff;border:1px solid var(--border);border-radius:13px;padding:10px 12px;color:var(--muted);font-size:12px;line-height:1.55}
@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  #map{height:64vh;min-height:480px}
  .list-panel{display:none}
  .list-panel.open{display:block}
  .list{max-height:none}
  .mobile-tools{display:flex}
}
@media(min-width:851px){.mobile-tools{display:none}}
.mobile-tools{
  position:sticky;top:6px;z-index:1200;gap:7px;margin-bottom:7px
}
.mobile-tools button{
  flex:1;border:0;border-radius:10px;padding:10px;font-weight:800
}
#showMapBtn{background:#222;color:#fff}
#showListBtn{background:#fff;border:1px solid var(--border)}
.popup-check{
  display:flex;align-items:center;gap:8px;margin-top:9px;font-weight:700
}
.popup-check input{width:22px;height:22px;accent-color:var(--done)}

/* List/check screen: swap this one URL to replace the background image. */
.list-panel{
  --list-night-image:url("./uguisu-night.png?v=2");
  position:relative;
  isolation:isolate;
  color:#f8fafc;
  border-color:rgba(125,211,252,.26);
  background:transparent
}
.list-panel::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:var(--list-night-image) center 58% / cover no-repeat
}
.list-panel::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    linear-gradient(180deg,rgba(4,7,18,.4),rgba(4,7,18,.58)),
    radial-gradient(circle at 14% 18%,rgba(236,72,153,.13),transparent 31%),
    radial-gradient(circle at 86% 30%,rgba(34,211,238,.12),transparent 34%)
}
.list-panel .list-head{background:rgba(7,10,24,.68);border-bottom-color:rgba(148,163,184,.28);backdrop-filter:blur(14px) saturate(135%);-webkit-backdrop-filter:blur(14px) saturate(135%)}
.list-panel .list-head h2{color:#fff;text-shadow:0 0 18px rgba(34,211,238,.3)}
.list-panel #fitBtn{background:#f8fafc;color:#111827}
.list-panel #resetBtn{background:rgba(30,41,59,.9);color:#f8fafc;border:1px solid rgba(148,163,184,.42)}
.list-panel .list{padding:9px}
.list-panel .row{margin-bottom:8px;color:#f8fafc;border:1px solid rgba(148,163,184,.24);border-bottom-color:rgba(148,163,184,.24);background:rgba(8,12,27,.5);box-shadow:0 8px 22px rgba(0,0,0,.24);backdrop-filter:blur(1px) saturate(115%);-webkit-backdrop-filter:blur(1px) saturate(115%);transition:background .2s,border-color .2s}
.list-panel .row:hover{background:rgba(19,26,49,.48);border-color:rgba(103,232,249,.38)}
.list-panel .row.done{background:rgba(8,60,42,.48);border-color:rgba(74,222,128,.42)}
.list-panel .row.done .name{color:#86efac}
.list-panel .name{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.65)}
.list-panel .addr,.list-panel .save-note{color:#d8e1ee}
.list-panel .comment-title{color:#86efac}
.list-panel .detail-field,.list-panel .facility-title{color:#e0ecff}
.list-panel .detail-field input,.list-panel .detail-field select,.list-panel .comment{background:rgba(255,255,255,.96);color:#111827;border-color:rgba(186,230,253,.76)}
.list-panel .comment{background:rgba(255,253,242,.97);border-color:#d7b84a}
.list-panel .facility-chip span{background:rgba(248,250,252,.95);color:#334155;border-color:#cbd5e1}
.list-panel .facility-chip input:checked+span{background:#dcfce7;color:#166534;border-color:#4ade80}
.list-panel .status{color:#d8e1ee;border-top-color:rgba(148,163,184,.28);background:rgba(7,10,24,.8);backdrop-filter:blur(12px)}
@media(max-width:850px){
  .list-panel.open{overflow:visible;box-shadow:0 18px 55px rgba(0,0,0,.42)}
  .list-panel.open::after{position:fixed;inset:0;background-position:center 58%}
  .list-panel.open::before{position:fixed;inset:0;background:linear-gradient(180deg,rgba(4,7,18,.12),rgba(4,7,18,.18))}
  .list-panel .row{background:rgba(8,12,27,.4)}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .list-panel .row{background:rgba(8,12,27,.62)}
}

.share-strip{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.share-status{padding:6px 10px;border-radius:999px;background:#eef2ff;border:1px solid #a5b4fc;font-size:12px;font-weight:800}
.share-status.online{background:#eaf8ef;border-color:#65a97d;color:#25633f}
.share-status.error{background:#fff0f0;border-color:#d88;color:#922}
#copyShareBtn{background:#334155;color:#fff}
#signInBtn{background:#2563eb;color:#fff}
#signOutBtn{background:#fff;border:1px solid #64748b;color:#334155}
#accountStatus{font-size:12px;font-weight:800;color:#475569;align-self:center}
.celebration{position:fixed;inset:0;z-index:5000;display:grid;place-items:center;background:rgba(12,16,28,.48);backdrop-filter:blur(3px);overflow:hidden;animation:celebrationFade .35s ease both}
.celebration-card{position:relative;z-index:2;width:min(88vw,520px);padding:28px 20px;text-align:center;color:#fff;border:2px solid #ffffff80;border-radius:24px;background:linear-gradient(145deg,#d43d49,#8f1830);box-shadow:0 24px 80px #0008;animation:celebrationPop .55s cubic-bezier(.2,.9,.25,1.25) both}
.celebration.level-15 .celebration-card{background:linear-gradient(145deg,#a934ad,#4e237c)}
.celebration.level-20 .celebration-card{background:linear-gradient(145deg,#e67419,#b32537)}
.celebration.level-25 .celebration-card{background:linear-gradient(145deg,#d9a514,#d43d49);box-shadow:0 0 70px #ffd85f99,0 24px 90px #0009}
.celebration-kicker{font-size:13px;font-weight:900;letter-spacing:.18em;opacity:.9}
.celebration-title{margin:7px 0 5px;font-size:clamp(30px,9vw,54px);line-height:1.05;font-weight:1000;text-shadow:0 3px 12px #0005}
.celebration-sub{font-size:15px;font-weight:800}.celebration-hint{margin-top:14px;font-size:11px;opacity:.72}
.celebration-piece{position:absolute;top:-12vh;width:9px;height:18px;border-radius:2px;background:var(--piece);animation:pieceFall var(--fall) linear var(--delay) forwards;transform:rotate(var(--rotate))}
.celebration-burst{position:absolute;width:8px;height:8px;border-radius:50%;left:var(--x);top:var(--y);background:var(--piece);box-shadow:0 0 12px var(--piece);animation:burst 1.15s ease-out var(--delay) both}
@keyframes celebrationFade{from{opacity:0}to{opacity:1}}@keyframes celebrationPop{from{opacity:0;transform:scale(.72) rotate(-2deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes pieceFall{to{transform:translate(var(--drift),115vh) rotate(calc(var(--rotate) + 720deg));opacity:.2}}@keyframes burst{0%{transform:scale(.1);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@media(prefers-reduced-motion:reduce){.celebration,.celebration-card{animation:none}.celebration-piece,.celebration-burst{display:none}}

</style>
</head>
<body>
<div class="app">
<header>
<h1>鶯谷コンプリートマップ</h1>
<p class="sub">左：実地図上の番号ピン　／　右：ホテル名・チェック欄・コメントメモ</p><div style="margin-top:7px;display:inline-block;padding:4px 9px;border-radius:999px;background:#fff3cd;border:1px solid #e2c15b;font-size:12px;font-weight:800;">リアルタイム共有版 v3</div>
<div class="progress-row"><div class="progress"><span id="bar"></span></div><div class="count" id="count">0 / 28</div></div><div class="share-strip"><span id="shareStatus" class="share-status">ログインを確認中…</span><span id="accountStatus">共有編集にはGoogleログインが必要です</span><button id="signInBtn" type="button">Googleでログイン</button><button id="signOutBtn" type="button" hidden>ログアウト</button><button id="copyShareBtn" type="button">共有URLをコピー</button><button id="backupBtn" type="button">記録をバックアップ</button></div>
</header>

<div class="mobile-tools">
  <button id="showMapBtn" type="button">地図を見る</button>
  <button id="showListBtn" type="button">一覧・チェック</button>
</div>
<div class="layout">
  <section class="map-panel"><div id="map"></div></section>
  <aside class="list-panel">
    <div class="list-head">
      <h2>ホテル一覧（28軒）</h2>
      <div class="actions"><button id="fitBtn">全体表示</button><button id="resetBtn" title="チェックのみ解除。コメントは残ります">チェック解除</button></div>
    </div>
    <div class="list" id="list"></div>
    <div class="status" id="status">地図を準備しています…</div>
  </aside>
</div>

<div class="note">
OpenStreetMapの実地図を表示し、住所の座標化には国土地理院の住所検索を使用する。
同一住所の「Bella HOTEL」と「HOTEL LUX」は、重ならないようにピンを少しずらして表示する。
</div>

const list=document.getElementById("list"),statusEl=document.getElementById("status"),shareStatus=document.getElementById("shareStatus"),accountStatus=document.getElementById("accountStatus"),signInBtn=document.getElementById("signInBtn"),signOutBtn=document.getElementById("signOutBtn"),markers=new Map(),bounds=L.latLngBounds([]),saved={},comments={},records={},rowRefs=new Map();

  const colors=["#ffd84d","#ff5c7a","#59d9ff","#8cff9d","#ffffff","#c88cff"],pieces=milestone>=25?64:milestone>=20?48:milestone>=15?38:28;
  for(let i=0;i<pieces;i++){const p=document.createElement("i");p.className="celebration-piece";p.style.cssText=`left:${Math.random()*100}%;--piece:${colors[i%colors.length]};--fall:${1.7+Math.random()*1.3}s;--delay:${Math.random()*.45}s;--rotate:${Math.random()*360}deg;--drift:${-70+Math.random()*140}px`;overlay.appendChild(p)}
  if(milestone>=15){const bursts=milestone>=25?36:milestone>=20?26:18;for(let i=0;i<bursts;i++){const b=document.createElement("i");b.className="celebration-burst";const a=Math.random()*Math.PI*2,d=45+Math.random()*135;b.style.cssText=`--x:${12+Math.random()*76}%;--y:${10+Math.random()*48}%;--piece:${colors[i%colors.length]};--delay:${Math.random()*.55}s;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;overlay.appendChild(b)}}
  let timer;const close=()=>{clearTimeout(timer);overlay.remove()};overlay.addEventListener("click",close,{once:true});document.body.appendChild(overlay);timer=setTimeout(close,milestone>=25?4200:3000)
}
function maybeCelebrate(previous,current){if(current<=previous)return;const seen=getSeenMilestones(),crossed=MILESTONES.filter(n=>previous<n&&current>=n&&!seen.has(n));if(!crossed.length)return;crossed.forEach(n=>seen.add(n));saveSeenMilestones(seen);showCelebration(crossed[crossed.length-1])}
function applyHotelState(id,state={}){id=Number(id);const row=rowRefs.get(id);if(!row)return;const checked=!!state.done,comment=state.comment||"";saved[id]=checked;comments[id]=comment;records[id]={...(records[id]||{}),...state,done:checked,comment};const cb=row.querySelector(".chk"),ta=row.querySelector(".comment"),day=row.querySelector(".day-type"),price=row.querySelector(".price"),room=row.querySelector(".room-number");cb.checked=checked;if(document.activeElement!==ta)ta.value=comment;if(document.activeElement!==day)day.value=state.dayType||"";if(document.activeElement!==price)price.value=state.price??"";if(document.activeElement!==room)room.value=state.roomNumber||"";const selected=new Set(Array.isArray(state.facilities)?state.facilities:[]);row.querySelectorAll(".facility").forEach(el=>el.checked=selected.has(el.value));row.classList.toggle("done",checked);const m=markers.get(id);if(m)m.setIcon(markerIcon(id,checked));updateProgress()}
async function saveHotel(id,patch){if(!ROOM_ID)return;await setDoc(doc(db,"uguisu",ROOM_ID,"hotels",String(id)),{...patch,updatedAt:serverTimestamp()},{merge:true})}
function buildRows(){HOTELS.forEach(h=>{const row=document.createElement("div");row.className="row";row.dataset.id=h.id;row.innerHTML=`<span class="num">${h.id}</span><span><div class="name">${h.name}</div><div class="addr">${h.address}</div><div class="detail-grid"><label class="detail-field">曜日区分<select class="day-type"><option value="">未選択</option><option value="weekday">平日</option><option value="holiday">土日祝</option></select></label><label class="detail-field">料金（円）<input class="price" type="number" min="0" step="1" inputmode="numeric" placeholder="例：6800"></label><label class="detail-field">部屋番号<input class="room-number" type="text" maxlength="30" placeholder="例：302"></label></div><div class="facility-title">設備タグ</div><div class="facilities">${FACILITIES.map(f=>`<label class="facility-chip"><input class="facility" type="checkbox" value="${f}"><span>${f}</span></label>`).join("")}</div><div class="comment-title">感想・自由メモ</div><textarea class="comment" maxlength="300" placeholder="これまでのコメントはそのまま残ります"></textarea><div class="save-note" aria-live="polite"></div></span><input class="chk" type="checkbox" aria-label="${h.name}を制覇済みにする">`;const cb=row.querySelector(".chk"),ta=row.querySelector(".comment"),day=row.querySelector(".day-type"),price=row.querySelector(".price"),room=row.querySelector(".room-number"),note=row.querySelector(".save-note");cb.addEventListener("change",async()=>{const previous=getDoneCount();row.classList.toggle("done",cb.checked);saved[h.id]=cb.checked;records[h.id]={...(records[h.id]||{}),done:cb.checked};const m=markers.get(h.id);if(m)m.setIcon(markerIcon(h.id,cb.checked));const current=updateProgress();if(initialSyncComplete)maybeCelebrate(previous,current);lastKnownDone=current;try{await saveHotel(h.id,{done:cb.checked})}catch(e){console.error(e);setShareStatus("チェック保存に失敗","error")}});let timer,pending={};const queueSave=(patch)=>{pending={...pending,...patch};records[h.id]={...(records[h.id]||{}),...patch};note.textContent="保存中…";note.className="save-note";clearTimeout(timer);timer=setTimeout(async()=>{const payload=pending;pending={};try{await saveHotel(h.id,payload);note.textContent="保存済み ✓";note.className="save-note saved";setTimeout(()=>{if(note.textContent==="保存済み ✓")note.textContent=""},1800)}catch(e){console.error(e);pending={...payload,...pending};note.textContent="保存に失敗しました";note.className="save-note error";setShareStatus("記録保存に失敗","error")}},500)};ta.addEventListener("input",()=>{comments[h.id]=ta.value;queueSave({comment:ta.value})});day.addEventListener("change",()=>queueSave({dayType:day.value}));price.addEventListener("input",()=>queueSave({price:price.value===""?null:Number(price.value)}));room.addEventListener("input",()=>queueSave({roomNumber:room.value}));row.querySelectorAll(".facility").forEach(el=>el.addEventListener("change",()=>queueSave({facilities:[...row.querySelectorAll(".facility:checked")].map(x=>x.value)})));rowRefs.set(h.id,row);list.appendChild(row)})}
async function connectSharedData(){if(sharedConnected)return;if(!ROOM_ID){setShareStatus("共有URLが不正です","error");statusEl.textContent="URLに共有ルームが指定されていません。";setEditingEnabled(false);return}sharedConnected=true;const hotelsRef=collection(db,"uguisu",ROOM_ID,"hotels");try{const existing=await getDocs(hotelsRef);if(existing.empty){const lc=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"),lm=JSON.parse(localStorage.getItem(COMMENT_KEY)||"{}");if(Object.keys(lc).length||Object.keys(lm).length){const batch=writeBatch(db);HOTELS.forEach(h=>{if(lc[h.id]||lm[h.id])batch.set(doc(db,"uguisu",ROOM_ID,"hotels",String(h.id)),{done:!!lc[h.id],comment:lm[h.id]||"",updatedAt:serverTimestamp()},{merge:true})});await batch.commit()}}onSnapshot(hotelsRef,snap=>{const previous=lastKnownDone;snap.docChanges().forEach(ch=>applyHotelState(ch.doc.id,ch.type==="removed"?{done:false,comment:""}:ch.doc.data()));const current=getDoneCount();if(initialSyncComplete)maybeCelebrate(previous,current);else{const seen=getSeenMilestones();MILESTONES.filter(n=>current>=n).forEach(n=>seen.add(n));saveSeenMilestones(seen);initialSyncComplete=true}lastKnownDone=current;setShareStatus("リアルタイム共有中","online")},e=>{console.error(e);setShareStatus("共有接続エラー","error")})}catch(e){console.error(e);setShareStatus("共有接続エラー","error")}}
const cache=JSON.parse(localStorage.getItem("uguisudani_gsi_cache_v1")||"{}");
async function geocode(h){if(cache[h.address])return cache[h.address];const q=h.address.replace("東京都","");const r=await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q));if(!r.ok)throw new Error("GSI");const j=await r.json();if(!Array.isArray(j)||!j.length||!j[0].geometry)throw new Error("not found");const c=j[0].geometry.coordinates,p={lat:Number(c[1]),lon:Number(c[0])};cache[h.address]=p;localStorage.setItem("uguisudani_gsi_cache_v1",JSON.stringify(cache));return p}
async function buildMap(){let ok=0,fail=0;for(let i=0;i<HOTELS.length;i++){const h=HOTELS[i];statusEl.textContent=`位置確認中… ${i+1} / ${HOTELS.length}`;try{const p=await geocode(h);let lat=p.lat,lon=p.lon;if(h.id===13){lat+=0.000035;lon+=0.000045}const m=L.marker([lat,lon],{icon:markerIcon(h.id,!!saved[h.id])}).addTo(map);m.bindPopup(`<div><b>${h.id}. ${h.name}</b><br><span style="font-size:11px">${h.address}</span><br><span style="font-size:11px;color:#666">編集は「一覧・チェック」から</span></div>`);markers.set(h.id,m);bounds.extend([lat,lon]);ok++}catch(e){fail++;const a=document.querySelector(`.row[data-id="${h.id}"] .addr`);if(a)a.textContent=h.address+"（位置取得失敗）"}await new Promise(r=>setTimeout(r,120))}if(bounds.isValid())map.fitBounds(bounds.pad(.08));statusEl.textContent=`位置取得完了：${ok}軒${fail?`／未取得 ${fail}軒`:""}`}
document.getElementById("copyShareBtn").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(location.href);const b=document.getElementById("copyShareBtn"),o=b.textContent;b.textContent="コピー完了";setTimeout(()=>b.textContent=o,1500)}catch{prompt("このURLをコピーしてください",location.href)}});
document.getElementById("backupBtn").addEventListener("click",()=>{const data={version:1,exportedAt:new Date().toISOString(),roomId:ROOM_ID,hotels:HOTELS.map(h=>({id:h.id,name:h.name,address:h.address,done:!!saved[h.id],comment:comments[h.id]||"",dayType:records[h.id]?.dayType||"",price:records[h.id]?.price??null,roomNumber:records[h.id]?.roomNumber||"",facilities:Array.isArray(records[h.id]?.facilities)?records[h.id].facilities:[]}))};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`uguisu-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
document.getElementById("fitBtn").addEventListener("click",()=>{if(bounds.isValid())map.fitBounds(bounds.pad(.08))});
document.getElementById("resetBtn").addEventListener("click",async()=>{if(!ROOM_ID||!confirm("共有している全チェックを解除します。コメントは残します。"))return;try{const batch=writeBatch(db);HOTELS.forEach(h=>batch.set(doc(db,"uguisu",ROOM_ID,"hotels",String(h.id)),{done:false,updatedAt:serverTimestamp()},{merge:true}));await batch.commit()}catch(e){console.error(e);setShareStatus("全解除に失敗","error")}});
const listPanel=document.querySelector(".list-panel"),mapPanel=document.querySelector(".map-panel");document.getElementById("showListBtn")?.addEventListener("click",()=>{listPanel.classList.add("open");listPanel.scrollIntoView({behavior:"smooth",block:"start"})});document.getElementById("showMapBtn")?.addEventListener("click",()=>{listPanel.classList.remove("open");mapPanel.scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>map.invalidateSize(),250)});
signInBtn.addEventListener("click",async()=>{try{await signInWithRedirect(auth,googleProvider)}catch(e){console.error(e);setShareStatus("ログインを開始できませんでした","error")}});
signOutBtn.addEventListener("click",()=>signOut(auth));
buildRows();updateProgress();setEditingEnabled(false);onAuthStateChanged(auth,user=>{if(!user){accountStatus.textContent="共有編集にはGoogleログインが必要です";signInBtn.hidden=false;signOutBtn.hidden=true;setShareStatus("ログインしてください");setEditingEnabled(false);return}accountStatus.textContent=`ログイン中：${user.email||"Googleアカウント"}`;signInBtn.hidden=true;signOutBtn.hidden=false;setEditingEnabled(true);connectSharedData()});buildMap();
</script>
