<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鶯谷北口ホテル制覇マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg:#f3f1ec; --panel:#fff; --ink:#202124; --muted:#6b7280;
  --accent:#d43d49; --done:#2f7d59; --border:#d8d8d8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
.app{max-width:1500px;margin:auto;padding:10px}
header{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:13px 15px;margin-bottom:9px}
h1{margin:0 0 4px;font-size:22px}
.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.progress-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.progress{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden;flex:1}
.progress span{display:block;height:100%;width:0;background:var(--done);transition:.2s}
.count{font-weight:800;min-width:80px;text-align:right}
.layout{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(340px,.9fr);gap:9px;align-items:stretch}
.map-panel,.list-panel{background:var(--panel);border:1px solid var(--border);border-radius:15px;overflow:hidden}
#map{height:850px;width:100%}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border-bottom:1px solid var(--border)}
.list-head h2{font-size:17px;margin:0}
.actions{display:flex;gap:6px}
button{border:0;border-radius:8px;padding:7px 9px;font-weight:700;cursor:pointer}
#resetBtn{background:#ececec} #fitBtn{background:#222;color:white}
.list{padding:7px;max-height:793px;overflow:auto}
.row{
  display:grid;
  grid-template-columns:34px 1fr 28px;
  gap:8px;
  align-items:start;
  padding:9px 7px;
  border-bottom:1px solid #ececec;
  border-radius:8px
}
.row:hover{background:#f7f7f7}
.num{width:30px;height:30px;border:2px solid var(--accent);color:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.row.done{background:#edf7f1}
.row.done .num{background:var(--done);border-color:var(--done);color:white}
.row.done .name{color:var(--done);text-decoration:line-through}
.name{font-weight:700;font-size:13px;line-height:1.25}
.addr{font-size:10px;color:var(--muted);margin-top:2px}
.comment{
  width:100%;
  min-height:58px;
  margin-top:7px;
  padding:7px 8px;
  resize:vertical;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
  color:var(--ink);
  font:inherit;
  font-size:12px;
  line-height:1.4
}
.comment:focus{
  outline:2px solid rgba(47,125,89,.25);
  border-color:var(--done)
}
.comment::placeholder{color:#9ca3af}
.chk{width:21px;height:21px;accent-color:var(--done);margin-top:4px}
.status{padding:8px 13px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:#fafafa}
.marker-number{width:30px;height:30px;border-radius:50%;background:var(--accent);border:2px solid white;color:white;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 2px 6px #0005}
.marker-number.done{background:var(--done)}
.leaflet-div-icon{background:transparent;border:0}
.note{margin-top:9px;background:#fff;border:1px solid var(--border);border-radius:13px;padding:10px 12px;color:var(--muted);font-size:12px;line-height:1.55}
@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  #map{height:64vh;min-height:480px}
  .list-panel{display:none}
  .list-panel.open{display:block}
  .list{max-height:none}
  .mobile-tools{display:flex}
}
@media(min-width:851px){.mobile-tools{display:none}}
.mobile-tools{
  position:sticky;top:6px;z-index:1200;gap:7px;margin-bottom:7px
}
.mobile-tools button{
  flex:1;border:0;border-radius:10px;padding:10px;font-weight:800
}
#showMapBtn{background:#222;color:#fff}
#showListBtn{background:#fff;border:1px solid var(--border)}
.popup-check{
  display:flex;align-items:center;gap:8px;margin-top:9px;font-weight:700
}
.popup-check input{width:22px;height:22px;accent-color:var(--done)}

</style>
</head>
<body>
<div class="app">
<header>
<h1>鶯谷北口エリア ホテル制覇マップ</h1>
<p class="sub">左：実地図上の番号ピン　／　右：ホテル名・チェック欄・コメントメモ</p>
<div class="progress-row"><div class="progress"><span id="bar"></span></div><div class="count" id="count">0 / 28</div></div>
</header>

<div class="mobile-tools">
  <button id="showMapBtn" type="button">地図を見る</button>
  <button id="showListBtn" type="button">一覧・チェック</button>
</div>
<div class="layout">
  <section class="map-panel"><div id="map"></div></section>
  <aside class="list-panel">
    <div class="list-head">
      <h2>ホテル一覧（28軒）</h2>
      <div class="actions"><button id="fitBtn">全体表示</button><button id="resetBtn" title="チェックのみ解除。コメントは残ります">チェック解除</button></div>
    </div>
    <div class="list" id="list"></div>
    <div class="status" id="status">地図を準備しています…</div>
  </aside>
</div>

<div class="note">
OpenStreetMapの実地図を表示し、住所の座標化には国土地理院の住所検索を使用する。
同一住所の「Bella HOTEL」と「HOTEL LUX」は、重ならないようにピンを少しずらして表示する。
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const HOTELS = [{"id": 1, "name": "シャルム鶯谷Ⅰ", "address": "東京都台東区根岸1-8-12"}, {"id": 2, "name": "HOTEL Apio & EL Apio", "address": "東京都台東区根岸1-8-15"}, {"id": 3, "name": "ホテル サンモリッツ・テラ", "address": "東京都台東区根岸1-7-1"}, {"id": 4, "name": "HOTEL EXE 鶯谷", "address": "東京都台東区根岸1-7-2"}, {"id": 5, "name": "ホテル プランタン", "address": "東京都台東区根岸1-7-5"}, {"id": 6, "name": "HOTEL KARUTA UGUISUDANI", "address": "東京都台東区根岸1-7-12"}, {"id": 7, "name": "ホテル バリバリ鶯谷", "address": "東京都台東区根岸1-7-15"}, {"id": 8, "name": "HOTEL EXE ANNEX 鶯谷", "address": "東京都台東区根岸1-6-3"}, {"id": 9, "name": "HOTEL ENJU", "address": "東京都台東区根岸1-5-3"}, {"id": 10, "name": "HOTEL SAVOY 鶯谷", "address": "東京都台東区根岸1-5-5"}, {"id": 11, "name": "HOTEL ENJU 別邸万華", "address": "東京都台東区根岸1-5-6"}, {"id": 12, "name": "鶯谷 Bella HOTEL", "address": "東京都台東区根岸1-5-7"}, {"id": 13, "name": "HOTEL LUX", "address": "東京都台東区根岸1-5-7"}, {"id": 14, "name": "Asian P-DOOR", "address": "東京都台東区根岸1-5-22"}, {"id": 15, "name": "HOTEL SERA Apio", "address": "東京都台東区根岸1-5-23"}, {"id": 16, "name": "SCHALL", "address": "東京都台東区根岸1-3-9"}, {"id": 17, "name": "HOTEL NIKKO 鶯谷", "address": "東京都台東区根岸1-3-11"}, {"id": 18, "name": "ホテル サンモリッツ・エコ", "address": "東京都台東区根岸1-3-12"}, {"id": 19, "name": "ホテル サンモリッツ", "address": "東京都台東区根岸1-3-15"}, {"id": 20, "name": "ホテル シャーウッド", "address": "東京都台東区根岸1-2-21"}, {"id": 21, "name": "HOTEL STELA", "address": "東京都台東区根岸2-2-9"}, {"id": 22, "name": "ホテル 絆 KIZUNA", "address": "東京都台東区根岸2-2-11"}, {"id": 23, "name": "HOTEL SEEDS 鶯谷店", "address": "東京都台東区根岸2-4-11"}, {"id": 24, "name": "ホテル ニューシーズ鶯谷", "address": "東京都台東区根岸2-4-12"}, {"id": 25, "name": "Legend P-DOOR", "address": "東京都台東区根岸2-5-3"}, {"id": 26, "name": "P-DOOR GOLD", "address": "東京都台東区根岸2-10-17"}, {"id": 27, "name": "ホテル ルナ＆シーヘブン", "address": "東京都台東区根岸2-11-9"}, {"id": 28, "name": "HOTEL Diana", "address": "東京都台東区根岸2-13-7"}];
const STORAGE_KEY='uguisudani_conquest_exact_v1';
const COMMENT_KEY='uguisudani_hotel_comments_v1';
const map=L.map('map',{zoomControl:true}).setView([35.7214,139.7787],16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

const list=document.getElementById('list');
const statusEl=document.getElementById('status');
const markers=new Map();
const bounds=L.latLngBounds([]);
const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
const comments=JSON.parse(localStorage.getItem(COMMENT_KEY)||'{}');

function markerIcon(id,done=false){
  return L.divIcon({
    className:'leaflet-div-icon',
    html:`<div class="marker-number ${done?'done':''}">${id}</div>`,
    iconSize:[30,30], iconAnchor:[15,15]
  });
}

HOTELS.forEach(h=>{
  const row=document.createElement('div');
  row.className='row'+(saved[h.id]?' done':'');
  row.dataset.id=h.id;

  const safeComment=(comments[h.id]||'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');

  row.innerHTML=`
    <span class="num">${h.id}</span>
    <span>
      <div class="name">${h.name}</div>
      <div class="addr">${h.address}</div>
      <textarea class="comment" maxlength="300" placeholder="感想・料金・部屋番号などをメモ">${safeComment}</textarea>
    </span>
    <input class="chk" type="checkbox" aria-label="${h.name}を制覇済みにする" ${saved[h.id]?'checked':''}>
  `;

  const checkbox=row.querySelector('.chk');
  const comment=row.querySelector('.comment');

  checkbox.addEventListener('change',e=>{
    saved[h.id]=e.target.checked;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));
    row.classList.toggle('done',e.target.checked);
    const m=markers.get(h.id);
    if(m)m.setIcon(markerIcon(h.id,e.target.checked));
    updateProgress();
  });

  let saveTimer;
  comment.addEventListener('input',e=>{
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      comments[h.id]=e.target.value;
      localStorage.setItem(COMMENT_KEY,JSON.stringify(comments));
    },250);
  });

  list.appendChild(row);
});

function updateProgress(){
  const done=HOTELS.filter(h=>saved[h.id]).length;
  document.getElementById('count').textContent=`${done} / ${HOTELS.length}`;
  document.getElementById('bar').style.width=`${done/HOTELS.length*100}%`;
}
updateProgress();

const cache=JSON.parse(localStorage.getItem('uguisudani_gsi_cache_v1')||'{}');

async function geocode(h,index){
  if(cache[h.address]) return cache[h.address];

  const query=h.address.replace('東京都','');
  const url='https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(query);
  const r=await fetch(url);
  if(!r.ok) throw new Error('GSI geocode failed');

  const j=await r.json();
  if(!Array.isArray(j) || !j.length || !j[0].geometry) throw new Error('not found');

  const coords=j[0].geometry.coordinates;
  const p={lat:Number(coords[1]),lon:Number(coords[0])};
  if(!Number.isFinite(p.lat) || !Number.isFinite(p.lon)) throw new Error('invalid coordinates');

  cache[h.address]=p;
  localStorage.setItem('uguisudani_gsi_cache_v1',JSON.stringify(cache));
  return p;
}

async function build(){
  let ok=0,fail=0;
  for(let i=0;i<HOTELS.length;i++){
    const h=HOTELS[i];
    statusEl.textContent=`位置確認中… ${i+1} / ${HOTELS.length}`;
    try{
      const p=await geocode(h,i);
      let lat=p.lat, lon=p.lon;
      // 同一住所ピンの重なり回避
      if(h.id===13){lat+=0.000035;lon+=0.000045;}
      const m=L.marker([lat,lon],{icon:markerIcon(h.id,!!saved[h.id])}).addTo(map);
      function popupHtml(){
        return `<div><b>${h.id}. ${h.name}</b><br><span style="font-size:11px">${h.address}</span>
        <label class="popup-check"><input type="checkbox" data-popup-id="${h.id}" ${saved[h.id]?'checked':''}> 行った</label></div>`;
      }
      m.bindPopup(popupHtml());
      m.on('popupopen',()=>{
        const cb=document.querySelector(`input[data-popup-id="${h.id}"]`);
        if(cb){
          cb.checked=!!saved[h.id];
          cb.addEventListener('change',()=>{
            saved[h.id]=cb.checked;
            localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));
            const listCb=document.querySelector(`.row[data-id="${h.id}"] .chk`);
            if(listCb) listCb.checked=cb.checked;
            const row=document.querySelector(`.row[data-id="${h.id}"]`);
            row?.classList.toggle('done',cb.checked);
            m.setIcon(markerIcon(h.id,cb.checked));
            updateProgress();
            m.setPopupContent(popupHtml());
          },{once:true});
        }
      });
      markers.set(h.id,m);
      bounds.extend([lat,lon]);
      ok++;
    }catch(e){
      fail++;
      const row=document.querySelector(`.row[data-id="${h.id}"] .addr`);
      if(row)row.textContent=h.address+'（位置取得失敗）';
    }
    await new Promise(r=>setTimeout(r,120));
  }
  if(bounds.isValid()) map.fitBounds(bounds.pad(0.08));
  statusEl.textContent=`位置取得完了：${ok}軒${fail?`／未取得 ${fail}軒`:''}`;
}

document.getElementById('fitBtn').addEventListener('click',()=>{if(bounds.isValid())map.fitBounds(bounds.pad(.08));});
document.getElementById('resetBtn').addEventListener('click',()=>{
  HOTELS.forEach(h=>saved[h.id]=false);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));
  document.querySelectorAll('.row').forEach(r=>r.classList.remove('done'));
  document.querySelectorAll('.chk').forEach(c=>c.checked=false);
  markers.forEach((m,id)=>m.setIcon(markerIcon(id,false)));
  updateProgress();
});
const listPanel=document.querySelector('.list-panel');
const mapPanel=document.querySelector('.map-panel');
document.getElementById('showListBtn')?.addEventListener('click',()=>{
  listPanel.classList.add('open');
  listPanel.scrollIntoView({behavior:'smooth',block:'start'});
});
document.getElementById('showMapBtn')?.addEventListener('click',()=>{
  listPanel.classList.remove('open');
  mapPanel.scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(()=>map.invalidateSize(),250);
});
build();
</script>
</body>
</html>
