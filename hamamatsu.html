function buildRows(){HOTELS.forEach(h=>{const row=document.createElement("div");row.className="row";row.dataset.id=h.id;row.innerHTML=`<span class="num">${h.id}</span><span><div class="name">${h.name}</div><div class="addr">${h.address}${h.note?` ／ ${h.note}`:""}</div><div class="detail-grid"><label class="detail-field">曜日区分<select class="day-type"><option value="">未選択</option><option value="weekday">平日</option><option value="holiday">土日祝</option></select></label><label class="detail-field">使った金額（円）<input class="price" type="number" min="0" step="1" inputmode="numeric" placeholder="例：1200"></label><label class="detail-field">滞在時間（分）<input class="room-number" type="text" maxlength="30" inputmode="numeric" placeholder="例：90"></label></div><div class="facility-title">楽しみ方タグ</div><div class="facilities">${FACILITIES.map(f=>`<label class="facility-chip"><input class="facility" type="checkbox" value="${f}"><span>${f}</span></label>`).join("")}</div><div class="comment-title">感想・自由メモ</div><textarea class="comment" maxlength="300" placeholder="楽しかったこと、また行きたい理由など"></textarea><div class="save-note" aria-live="polite"></div></span><input class="chk" type="checkbox" aria-label="${h.name}に行った">`;const cb=row.querySelector(".chk"),ta=row.querySelector(".comment"),day=row.querySelector(".day-type"),price=row.querySelector(".price"),room=row.querySelector(".room-number"),note=row.querySelector(".save-note");cb.addEventListener("change",async()=>{const previous=getDoneCount();row.classList.toggle("done",cb.checked);saved[h.id]=cb.checked;records[h.id]={...(records[h.id]||{}),done:cb.checked};const m=markers.get(h.id);if(m)m.setIcon(markerIcon(h.id,cb.checked));const current=updateProgress();if(initialSyncComplete)maybeCelebrate(previous,current);lastKnownDone=current;try{await saveHotel(h.id,{done:cb.checked})}catch(e){console.error(e);setShareStatus("チェック保存に失敗","error")}});let timer,pending={};const queueSave=(patch)=>{pending={...pending,...patch};records[h.id]={...(records[h.id]||{}),...patch};note.textContent="保存中…";note.className="save-note";clearTimeout(timer);timer=setTimeout(async()=>{const payload=pending;pending={};try{await saveHotel(h.id,payload);note.textContent="保存済み ✓";note.className="save-note saved";setTimeout(()=>{if(note.textContent==="保存済み ✓")note.textContent=""},1800)}catch(e){console.error(e);pending={...payload,...pending};note.textContent="保存に失敗しました";note.className="save-note error";setShareStatus("記録保存に失敗","error")}},500)};ta.addEventListener("input",()=>{comments[h.id]=ta.value;queueSave({comment:ta.value})});day.addEventListener("change",()=>queueSave({dayType:day.value}));price.addEventListener("input",()=>queueSave({price:price.value===""?null:Number(price.value)}));room.addEventListener("input",()=>queueSave({roomNumber:room.value}));row.querySelectorAll(".facility").forEach(el=>el.addEventListener("change",()=>queueSave({facilities:[...row.querySelectorAll(".facility:checked")].map(x=>x.value)})));rowRefs.set(h.id,row);list.appendChild(row)})}
function photoUrl(photo){if(photoUrls.has(photo.id))return photoUrls.get(photo.id);const bytes=photo.photoBytes?.toUint8Array?.()||new Uint8Array();const url=URL.createObjectURL(new Blob([bytes],{type:photo.contentType||"image/jpeg"}));photoUrls.set(photo.id,url);return url}
async function compressPhoto(file){if(!file?.type?.startsWith("image/"))throw new Error("画像ファイルを選んでください");const bitmap=await createImageBitmap(file),scale=Math.min(1,960/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const context=canvas.getContext("2d");if(!context)throw new Error("写真を処理できません");context.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();let quality=.72,blob=null;while(quality>=.42){blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",quality));if(blob&&blob.size<=500000)break;quality-=.1}if(!blob||blob.size>520000)throw new Error("写真を小さくできませんでした");return blob}
function getUploaderName(){const key=`hamamatsu-uploader-${ROOM_ID}`,savedName=localStorage.getItem(key);if(savedName)return savedName;const name=(prompt("写真を追加する人の名前を入力してください")||"").trim().slice(0,20)||"参加者";localStorage.setItem(key,name);return name}
function setupPhotoInputs(){rowRefs.forEach((row,id)=>{const body=row.children[1],tools=document.createElement("div");tools.className="photo-tools";tools.innerHTML=`<label class="photo-add">📷 写真を追加<input type="file" accept="image/*"></label><div class="spot-photos"></div>`;const input=tools.querySelector("input");input.addEventListener("change",async()=>{const file=input.files?.[0];input.value="";if(!file)return;if(sharedPhotos.filter(p=>Number(p.spotId)===Number(id)).length>=3){alert("1スポットにつき写真は3枚までです");return}const label=tools.querySelector(".photo-add"),old=label.textContent;label.childNodes[0].textContent="圧縮・送信中…";try{const blob=await compressPhoto(file),memo=(prompt("写真のひとこと（省略可）")||"").trim().slice(0,80);await addDoc(collection(db,"uguisu",ROOM_ID,"photos"),{spotId:Number(id),photoBytes:Bytes.fromUint8Array(new Uint8Array(await blob.arrayBuffer())),contentType:"image/jpeg",memo,uploaderName:getUploaderName(),createdAt:serverTimestamp()})}catch(e){console.error(e);alert(e instanceof Error?e.message:"写真を保存できませんでした")}finally{label.childNodes[0].textContent=old}});body.appendChild(tools)})}
function renderPhotos(){rowRefs.forEach((row,id)=>{const box=row.querySelector(".spot-photos"),items=sharedPhotos.filter(p=>Number(p.spotId)===Number(id));if(!box)return;box.innerHTML=items.map(p=>`<div class="spot-photo" data-photo="${p.id}"><img src="${photoUrl(p)}" alt="${HOTELS.find(h=>h.id===Number(id))?.name||"スポット"}の写真"><button type="button" aria-label="写真を削除">×</button><small>${p.memo||p.uploaderName||"思い出"}</small></div>`).join("");box.querySelectorAll("button").forEach(button=>button.addEventListener("click",async()=>{const id=button.closest(".spot-photo").dataset.photo;if(confirm("この写真を削除しますか？"))await deleteDoc(doc(db,"uguisu",ROOM_ID,"photos",id))}));const add=row.querySelector(".photo-add");if(add){add.style.display=items.length>=3?"none":"inline-flex"}});for(const id of [...albumSelection])if(!sharedPhotos.some(p=>p.id===id))albumSelection.delete(id);const grid=document.getElementById("photoAlbumGrid");grid.innerHTML=sharedPhotos.length?sharedPhotos.map(p=>`<button type="button" class="album-photo ${albumSelection.has(p.id)?"selected":""}" data-photo="${p.id}"><img src="${photoUrl(p)}" alt="アルバム写真"><b>${albumSelection.has(p.id)?"✓":"＋"}</b></button>`).join(""):`<div class="album-empty">写真を追加すると、ここに集まります。</div>`;grid.querySelectorAll(".album-photo").forEach(button=>button.addEventListener("click",()=>{const id=button.dataset.photo;if(albumSelection.has(id))albumSelection.delete(id);else if(albumSelection.size<20)albumSelection.add(id);else{alert("選べる写真は20枚までです");return}renderPhotos()}));document.getElementById("albumCount").textContent=`${albumSelection.size} / 20枚`;document.getElementById("saveAlbumBtn").disabled=albumSelection.size===0}
function connectPhotos(){onSnapshot(collection(db,"uguisu",ROOM_ID,"photos"),snap=>{sharedPhotos=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));renderPhotos()},e=>{console.error(e);setShareStatus("写真の共有に失敗","error")})}
async function saveAlbum(){const selected=[...albumSelection].map(id=>sharedPhotos.find(p=>p.id===id)).filter(Boolean);if(!selected.length)return;const columns=4,cellW=300,cellH=245,headerH=105,rows=Math.ceil(selected.length/columns),canvas=document.createElement("canvas");canvas.width=columns*cellW;canvas.height=headerH+rows*cellH;const context=canvas.getContext("2d");if(!context)return;context.fillStyle="#f3f1ec";context.fillRect(0,0,canvas.width,canvas.height);context.fillStyle="#202124";context.font="bold 38px sans-serif";context.fillText("浜松・浜名湖 COMPLETE MAP",30,48);context.font="20px sans-serif";context.fillText("FAMILY TRIP 2026",30,80);for(let i=0;i<selected.length;i++){const p=selected[i],spot=HOTELS.find(h=>h.id===Number(p.spotId)),image=await new Promise((resolve,reject)=>{const value=new Image();value.onload=()=>resolve(value);value.onerror=reject;value.src=photoUrl(p)}),x=(i%columns)*cellW+7,y=headerH+Math.floor(i/columns)*cellH+7,w=cellW-14,h=cellH-14,photoH=h-38,scale=Math.max(w/image.width,photoH/image.height),sw=w/scale,sh=photoH/scale,sx=(image.width-sw)/2,sy=(image.height-sh)/2;context.drawImage(image,sx,sy,sw,sh,x,y,w,photoH);context.fillStyle="#fff";context.fillRect(x,y+photoH,w,38);context.fillStyle="#202124";context.font="bold 15px sans-serif";context.fillText(`${spot?.id||""}. ${spot?.name||"思い出"}`.slice(0,24),x+7,y+photoH+23)}const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error("アルバムを作成できません")),"image/jpeg",.88)),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=`hamamatsu-album-${new Date().toISOString().slice(0,10)}.jpg`;link.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
document.getElementById("saveAlbumBtn").addEventListener("click",()=>saveAlbum().catch(e=>alert(e instanceof Error?e.message:"アルバムを作成できませんでした")));
async function connectSharedData(){if(!ROOM_ID){setShareStatus("共有URLが不正です","error");statusEl.textContent="URLに共有ルームが指定されていません。";document.querySelectorAll(".chk,.comment").forEach(el=>el.disabled=true);return}const hotelsRef=collection(db,"uguisu",ROOM_ID,"hotels");try{const existing=await getDocs(hotelsRef);if(existing.empty){const lc=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"),lm=JSON.parse(localStorage.getItem(COMMENT_KEY)||"{}");if(Object.keys(lc).length||Object.keys(lm).length){const batch=writeBatch(db);HOTELS.forEach(h=>{if(lc[h.id]||lm[h.id])batch.set(doc(db,"uguisu",ROOM_ID,"hotels",String(h.id)),{done:!!lc[h.id],comment:lm[h.id]||"",updatedAt:serverTimestamp()},{merge:true})});await batch.commit()}}onSnapshot(hotelsRef,snap=>{const previous=lastKnownDone;snap.docChanges().forEach(ch=>applyHotelState(ch.doc.id,ch.type==="removed"?{done:false,comment:""}:ch.doc.data()));const current=getDoneCount();if(initialSyncComplete)maybeCelebrate(previous,current);else{const seen=getSeenMilestones();MILESTONES.filter(n=>current>=n).forEach(n=>seen.add(n));saveSeenMilestones(seen);initialSyncComplete=true}lastKnownDone=current;setShareStatus("リアルタイム共有中","online")},e=>{console.error(e);setShareStatus("共有接続エラー","error")})}catch(e){console.error(e);setShareStatus("共有接続エラー","error")}}
const cache=JSON.parse(localStorage.getItem("hamamatsu_gsi_cache_v1")||"{}");
async function geocode(h){if(cache[h.address])return cache[h.address];const q=h.address.replace("静岡県","");const r=await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q));if(!r.ok)throw new Error("GSI");const j=await r.json();if(!Array.isArray(j)||!j.length||!j[0].geometry)throw new Error("not found");const c=j[0].geometry.coordinates,p={lat:Number(c[1]),lon:Number(c[0])};cache[h.address]=p;localStorage.setItem("hamamatsu_gsi_cache_v1",JSON.stringify(cache));return p}
async function buildMap(){let ok=0,fail=0;for(let i=0;i<HOTELS.length;i++){const h=HOTELS[i];statusEl.textContent=`位置確認中… ${i+1} / ${HOTELS.length}`;try{const p=await geocode(h);let lat=p.lat,lon=p.lon;if([10,11,12].includes(h.id)){lat+=(h.id-11)*0.00012;lon+=(h.id-11)*0.00012}const m=L.marker([lat,lon],{icon:markerIcon(h.id,!!saved[h.id])}).addTo(map);m.bindPopup(`<div><b>${h.id}. ${h.name}</b><br><span style="font-size:11px">${h.address}</span><br><span style="font-size:11px;color:#666">${h.note||""}</span></div>`);markers.set(h.id,m);bounds.extend([lat,lon]);ok++}catch(e){fail++;const a=document.querySelector(`.row[data-id="${h.id}"] .addr`);if(a)a.textContent=h.address+"（位置取得失敗）"}await new Promise(r=>setTimeout(r,120))}if(bounds.isValid())map.fitBounds(bounds.pad(.08));statusEl.textContent=`位置取得完了：${ok}か所${fail?`／未取得 ${fail}か所`:""}`}
