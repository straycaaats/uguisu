<body>
<main class="app">
  <header class="top">
<div>
<div class="eyebrow">ENJOY YOUR LIFE. / JAPAN 47</div>
<h1>家族で旅した<br>日本地図</h1>
<p class="lead">行った県をタップして色を塗ろう。小さな旅も、家族の宝物に。</p>
<p id="cloudStatus" class="lead" style="font-size:13px;margin-top:8px">この端末だけの地図です</p>
</div>
<div class="top-actions">
<button id="installApp" class="btn">ホーム画面に追加</button>
<a href="complete.html" class="btn" style="text-decoration:none">マイROOM</a>
<button id="createRoom" class="btn primary">＋ 新しいROOM</button>
<button id="shareRoom" class="btn primary" hidden>家族を招待</button>
<button id="importLocal" class="btn" hidden>端末記録を共有へ移す</button>
<button id="saveImage" class="btn">地図を画像保存</button>
<button id="backup" class="btn">記録をバックアップ</button>
<label class="btn" style="cursor:pointer">復元<input id="restore" type="file" accept="application/json" hidden>
</label>
</div>
</header>
<nav id="roomTabs" class="room-tabs" aria-label="ROOM切り替え"></nav>
  <section class="card">
<div class="stats">
<div class="big">
<span id="doneCount">0</span>
<small> / 47県</small>
</div>
<div class="bar">
<i id="progressBar">
</i>
</div>
<div id="percent" class="percent">0%</div>
</div>
<div id="filters" class="filters">
<button class="filter active" data-filter="all">すべて</button>
<button class="filter" data-filter="visited">行った県</button>
<button class="filter" data-filter="unvisited">まだの県</button>
<button class="filter" data-filter="北海道">北海道</button>
<button class="filter" data-filter="東北">東北</button>
<button class="filter" data-filter="関東">関東</button>
<button class="filter" data-filter="中部">中部</button>
<button class="filter" data-filter="近畿">近畿</button>
<button class="filter" data-filter="中国">中国</button>
<button class="filter" data-filter="四国">四国</button>
<button class="filter" data-filter="九州・沖縄">九州・沖縄</button>
</div>
</section>
  <div class="layout">
<section class="card map-card">
<div class="map-title">
<h2>JAPAN COMPLETE MAP</h2>
<span class="hint">県をタップ</span>
</div>
<div id="map" class="japan-map" aria-label="47都道府県地図">
</div>
</section>
<aside class="card side">
<div>
<h2 id="sideTitle">まだ行っていない県</h2>
<span class="hint">次の旅先を見つけよう</span>
</div>
<div id="nextList" class="next-list">
</div>
</aside>
</div>
  <div class="credit">この試作は端末内に保存されます。既存の浜松MAP・ROOMデータには影響しません。</div>
</main>
<div id="modal" class="modal" hidden>
<section class="sheet">
<div class="sheet-head">
<div>
<div class="eyebrow" id="regionName">JAPAN</div>
<h2 id="prefName">静岡県</h2>
</div>
<button id="close" class="close" aria-label="閉じる">×</button>
</div>
<label class="visited-toggle">
<input id="visited" type="checkbox">この県へ行ったことがある</label>
<div class="form-grid">
<div class="field">
<label for="year">旅行した年</label>
<input id="year" inputmode="numeric" maxlength="4" placeholder="例：2026">
</div>
<div class="field">
<label for="withWho">誰と行った？</label>
<input id="withWho" maxlength="30" placeholder="例：家族みんな">
</div>
<div class="field full">
<label for="memo">思い出メモ</label>
<textarea id="memo" maxlength="500" placeholder="楽しかった場所、食べたもの、また行きたい所など">
</textarea>
</div>
<div class="field full">
<label>思い出の写真（任意・最大10枚）</label>
<label class="photo-pick">📷 写真を追加する<input id="photo" type="file" accept="image/*" multiple>
</label>
<p class="photo-help">複数枚をまとめて選べます。家族共有時も、この県を開くと表示されます。</p>
<div id="photoGallery" class="photo-gallery"></div>
</div>
</div>
<div class="save-row">
<button id="cancel" class="btn">キャンセル</button>
<button id="save" class="btn primary">記録を保存</button>
</div>
</section>
</div>
<div id="toast" class="toast">保存しました</div>
<div id="celebrate" class="celebrate" hidden>
<div class="confetti" id="confetti">
</div>
<div>
<div class="eyebrow">JAPAN COMPLETE</div>
<b id="celebrateTitle">10県！</b>
<p id="celebrateText">家族の思い出が日本地図に広がりました。</p>
<button id="celebrateClose" class="btn">地図を見る</button>
</div>
</div>
<script type="module">

['茨城県','関東',535,355],['栃木県','関東',480,335],['群馬県','関東',425,335],['埼玉県','関東',465,380],['千葉県','関東',540,410],['東京都','関東',470,425],['神奈川県','関東',445,465],

const COLORS={'北海道':'#6aa7d9','東北':'#8e72bd','関東':'#e46679','中部':'#ef914d','近畿':'#e0bc3f','中国':'#5bad83','四国':'#42a6a1','九州・沖縄':'#4b85bf'};
let records={},localRecords={},activeCode=0,filter='all',modalPhotos=[],pendingPhotos=[],removedPhotoIds=new Set(),removeLegacyPhoto=false,photoUrls=[],cloudRoomId='',cloudInviteToken='',cloudRole='',cloudUnsub=null;
const $=s=>document.querySelector(s),dbPromise=openDb();
function openDb(){return new Promise((ok,no)=>{const req=indexedDB.open('japan47-memories',1);req.onupgradeneeded=()=>req.result.createObjectStore('records',{keyPath:'code'});req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}

function saveRoomRegistry(list){localStorage.setItem('japan47-rooms',JSON.stringify(list.slice(0,12)))}

async function createCloudRoom(){const btn=$('#createRoom'),defaultName=roomRegistry().length?'友達用ROOM':'家族用ROOM',title=(prompt('ROOMの名前を入力してください',defaultName)||'').trim().slice(0,24);if(!title)return;const color=ROOM_COLORS[roomRegistry().length%ROOM_COLORS.length];btn.disabled=true;setCloudUi('共有ROOMを準備しています…');try{const user=await ensureAuth(),roomRef=doc(collection(cloudDb,'completeRooms'));cloudRoomId=roomRef.id;cloudInviteToken=secureId(24);cloudRole='MASTER';await setDoc(roomRef,{ownerUid:user.uid,title,roomColor:color,roomType:'JAPAN_MAP',theme:'日本47都道府県',play:'TOGETHER',size:47,skin:'simple',items:PREFS.map(p=>p.name),createdAt:serverTimestamp(),version:3});await setDoc(doc(cloudDb,'completeRooms',cloudRoomId,'members',user.uid),{role:'MASTER',displayName:'MASTER',joinedAt:serverTimestamp()});await setDoc(doc(cloudDb,'completeInvites',cloudInviteToken),{roomId:cloudRoomId,ownerUid:user.uid,active:true,roomType:'JAPAN_MAP',title,roomColor:color,createdAt:serverTimestamp()});await setDoc(doc(cloudDb,'completeUsers',user.uid,'rooms',cloudRoomId),{role:'MASTER',roomType:'JAPAN_MAP',title,roomColor:color,skin:'simple',updatedAt:serverTimestamp()});rememberRoom({roomId:cloudRoomId,inviteToken:cloudInviteToken,title,color,role:'MASTER'});applyRoomColor(color);history.replaceState(null,'',roomUrl(cloudRoomId));records={};subscribeCloud();setCloudUi(`${title}を作成しました`);if(Object.keys(localRecords).length&&confirm('この端末にある記録を新しいROOMへ移しますか？'))await importLocalRecords()}catch(e){console.error(e);const msg=e?.code==='permission-denied'?'Firestoreルールの更新が必要です':'共有ROOMを作成できませんでした';setCloudUi(msg);alert(msg)}finally{btn.disabled=false}}
async function resumeCloudRoom(roomId){try{const user=await ensureAuth(),member=await getDoc(doc(cloudDb,'completeRooms',roomId,'members',user.uid)),room=await getDoc(doc(cloudDb,'completeRooms',roomId));if(!member.exists()||!room.exists()||room.data().roomType!=='JAPAN_MAP')throw new Error('invalid-room');const data=room.data(),title=data.title||'日本地図ROOM',color=data.roomColor||ROOM_COLORS[0];cloudRoomId=roomId;cloudRole=member.data().role||'PLAYER';const saved=roomRegistry().find(r=>r.roomId===roomId);cloudInviteToken=cloudRole==='MASTER'?(saved?.inviteToken||data.inviteToken||''):'';rememberRoom({roomId,...(cloudInviteToken?{inviteToken:cloudInviteToken}:{}),title,color,role:cloudRole});if(cloudRole==='MASTER'&&data.inviteToken)await setDoc(doc(cloudDb,'completeRooms',roomId),{inviteToken:deleteField()},{merge:true});applyRoomColor(color);history.replaceState(null,'',roomUrl(roomId));subscribeCloud()}catch(e){console.error(e);alert('この日本地図ROOMを開く権限がありません');if(localStorage.getItem('japan47-last-room')===roomId)localStorage.removeItem('japan47-last-room');history.replaceState(null,'',location.pathname);records={...localRecords};render();setCloudUi('この端末だけの地図です')}}

async function importLocalRecords(){if(!cloudRoomId||cloudRole!=='MASTER')return;const entries=Object.values(localRecords);if(!entries.length)return toast('移せる端末記録がありません');const btn=$('#importLocal');btn.disabled=true;try{const user=await ensureAuth();for(let i=0;i<entries.length;i++){const r=entries[i],allPhotos=[r.photo,...(r.photos||[])].filter(Boolean).slice(0,10),progressRef=doc(cloudDb,'completeRooms',cloudRoomId,'progress',String(r.code)),payload={done:!!r.visited,visited:!!r.visited,year:r.year||'',withWho:r.withWho||'',memo:r.memo||'',photoCount:allPhotos.length,updatedName:'MASTER',updatedAt:serverTimestamp()};await setDoc(progressRef,payload,{merge:true});for(const blob of allPhotos)await addDoc(collection(progressRef,'photos'),{photoBytes:Bytes.fromUint8Array(new Uint8Array(await blob.arrayBuffer())),contentType:'image/jpeg',uploadedBy:user.uid,createdAt:serverTimestamp()});setCloudUi(`端末記録を共有へ移しています… ${i+1}/${entries.length}`)}toast('端末記録を家族共有へ移しました')}catch(e){console.error(e);alert('一部の記録を移せませんでした：'+(e.code||e.message))}finally{btn.disabled=false}}

function photoUrl(blob){if(blob?.toUint8Array)blob=new Blob([blob.toUint8Array()],{type:'image/jpeg'});if(!blob)return'';const u=URL.createObjectURL(blob);photoUrls.push(u);return u}

async function openRecord(code){activeCode=Number(code);pendingPhotos=[];removedPhotoIds=new Set();removeLegacyPhoto=false;modalPhotos=[];const p=PREFS[activeCode-1],r=records[activeCode]||{};$('#regionName').textContent=p.region;$('#prefName').textContent=p.name;$('#visited').checked=!!r.visited;$('#year').value=r.year||'';$('#withWho').value=r.withWho||'';$('#memo').value=r.memo||'';const legacy=asBlob(r.photo||r.photoBytes);if(legacy)modalPhotos.push({id:'legacy',blob:legacy,legacy:true});if(!cloudRoomId){(r.photos||[]).forEach((blob,i)=>modalPhotos.push({id:`local-${i}`,blob:asBlob(blob),local:true}))}else{try{const snap=await getDocs(collection(cloudDb,'completeRooms',cloudRoomId,'progress',String(activeCode),'photos'));snap.forEach(d=>{const data=d.data();if(data.photoBytes)modalPhotos.push({id:d.id,blob:asBlob(data.photoBytes),uploadedBy:data.uploadedBy,cloud:true})})}catch(e){console.error(e);toast('追加写真を読み込めませんでした')}}$('#photo').value='';renderPhotoGallery();$('#modal').hidden=false}

async function compress(file){const img=await createImageBitmap(file),max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);img.close();let quality=.76,blob;do{blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',quality));quality-=.09}while(blob&&blob.size>350000&&quality>=.31);if(!blob||blob.size>500000)throw new Error('写真を十分に小さくできませんでした。別の写真を選んでください');return blob}

function celebrate(n){if(![1,10,20,30,40,47].includes(n))return;$('#celebrateTitle').textContent=n===47?'47都道府県 COMPLETE!':`${n}県！`;$('#celebrateText').textContent=n===1?'家族の旅の地図が始まりました。':n===47?'日本中が、家族の宝物になりました！':'家族の思い出が日本地図に広がりました。';$('#confetti').innerHTML=Array.from({length:Math.min(90,20+n)},(_,i)=>`<i style="--x:${Math.random()*100}%;--h:${Math.random()*360};--t:${1.5+Math.random()*2}s;--d:${-80+Math.random()*160}px;--r:${Math.random()*180}deg">

$('#close').onclick=$('#cancel').onclick=close;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});$('#photo').addEventListener('change',async e=>{const files=[...e.target.files];if(!files.length)return;if(modalPhotos.length+files.length>10){alert('写真は1県につき最大10枚です');e.target.value='';return}toast(`${files.length}枚の写真を軽くしています…`);try{for(const file of files){const blob=await compress(file),item={id:`pending-${crypto.randomUUID()}`,blob,pending:true};pendingPhotos.push(item);modalPhotos.push(item)}renderPhotoGallery()}catch(err){alert(err.message)}finally{e.target.value=''}});$('#photoGallery').addEventListener('click',e=>{const b=e.target.closest('[data-photo-index]');if(!b)return;const item=modalPhotos[Number(b.dataset.photoIndex)];if(item.legacy)removeLegacyPhoto=true;else if(item.cloud)removedPhotoIds.add(item.id);if(item.pending)pendingPhotos=pendingPhotos.filter(x=>x.id!==item.id);modalPhotos=modalPhotos.filter(x=>x!==item);renderPhotoGallery()});
$('#save').onclick=async()=>{if(!activeCode)return;const code=activeCode,before=PREFS.filter(p=>records[p.code]?.visited).length,old=records[code]||{},record={...old,code,visited:$('#visited').checked,year:$('#year').value.trim(),withWho:$('#withWho').value.trim(),memo:$('#memo').value.trim(),updatedAt:new Date().toISOString()};const btn=$('#save');btn.disabled=true;btn.textContent='保存中…';try{if(cloudRoomId){const user=await ensureAuth(),payload={done:record.visited,visited:record.visited,year:record.year,withWho:record.withWho,memo:record.memo,photoCount:modalPhotos.length,updatedBy:user.uid,updatedName:cloudRole==='MASTER'?'MASTER':'参加者',updatedAt:serverTimestamp()};if(removeLegacyPhoto){payload.photoBytes=deleteField();payload.contentType=deleteField()}const progressRef=doc(cloudDb,'completeRooms',cloudRoomId,'progress',String(code));await setDoc(progressRef,payload,{merge:true});for(const id of removedPhotoIds)await deleteDoc(doc(progressRef,'photos',id));for(const item of pendingPhotos)await addDoc(collection(progressRef,'photos'),{photoBytes:Bytes.fromUint8Array(new Uint8Array(await item.blob.arrayBuffer())),contentType:'image/jpeg',uploadedBy:user.uid,createdAt:serverTimestamp()})}else{if(removeLegacyPhoto)delete record.photo;record.photos=modalPhotos.filter(x=>!x.legacy).map(x=>x.blob);record.photoCount=modalPhotos.length;await put(record);localRecords[code]=record;records[code]=record}close();render();toast('思い出を保存しました');const after=PREFS.filter(p=>records[p.code]?.visited).length;if(after>before)celebrate(after)}catch(e){console.error(e);alert('記録を保存できませんでした：'+(e.code||e.message))}finally{btn.disabled=false;btn.textContent='記録を保存'}};

const blobToData=blob=>new Promise(ok=>{if(blob?.toUint8Array)blob=new Blob([blob.toUint8Array()],{type:'image/jpeg'});if(!blob)return ok('');const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(blob)});const dataToBlob=async data=>data?await(await fetch(data)).blob():null;
