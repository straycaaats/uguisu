<style>

2px;border-radius:50%;font-size:22px}.visited-toggle{display:flex;align-items:center;gap:10px;background:#eef6f2;border:1px solid #bfddce;padding:13px;border-radius:15px;font-weight:900}.visited-toggle input{width:22px;height:22px;accent-color:var(--done)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:900;color:var(--sub)}input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;color:var(--ink)}textarea{min-height:100px;resize:vertical}.photo-pick{display:block;border:2px dashed #cbbfae;background:#fff9ee;border-radius:16px;padding:16px;text-align:center;font-weight:900;cursor:pointer}.photo-pick input{display:none}.photo-preview{position:relative;margin-top:10px}.photo-preview img{width:100%;height:210px;object-fit:cover;border-radius:16px}.remove-photo{position:absolute;right:8px;top:8px;border:0;border-radius:99px;padding:8px 10px;background:#fff;color:#b43d34;font-weight:900}.save-row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.toast{position:fixed;left:50%;bottom:26px;translate:-50% 30px;background:#17232c;color:#fff;padding:12px 18px;border-radius:99px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;translate:-50% 0}.celebrate{position:fixed;inset:0;z-index:40;background:#152129e8;color:#fff;display:grid;place-items:center;text-align:center;padding:20px}.celebrate[hidden]{display:none}.celebrate b{display:block;font:900 clamp(44px,13vw,100px)/1 Georgia,serif;color:#ffd45d;text-shadow:0 5px 0 #c94642}.celebrate p{font-size:20px}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti i{position:absolute;top:-30px;width:12px;height:24px;background:hsl(var(--h) 80% 60%);left:var(--x);animation:fall var(--t) linear forwards;rotate:var(--r)}@keyframes fall{to{translate:var(--d) 110vh;rotate:720deg}}.credit{text-align:center;color:var(--sub);font-size:11px;margin-top:20px}

<body>
<main class="app">
  <header class="top"><div><div class="eyebrow">ENJOY YOUR LIFE. / JAPAN 47</div><h1>家族で旅した<br>日本地図</h1><p class="lead">行った県をタップして色を塗ろう。小さな旅も、家族の宝物に。</p><p id="cloudStatus" class="lead" style="font-size:13px;margin-top:8px">この端末だけの地図です</p></div><div class="top-actions"><a href="complete.html" class="btn" style="text-decoration:none">マイROOM</a><button id="createRoom" class="btn primary">家族共有ROOMを作る</button><button id="shareRoom" class="btn primary" hidden>家族を招待</button><button id="importLocal" class="btn" hidden>端末記録を共有へ移す</button><button id="saveImage" class="btn">地図を画像保存</button><button id="backup" class="btn">記録をバックアップ</button><label class="btn" style="cursor:pointer">復元<input id="restore" type="file" accept="application/json" hidden></label></div></header>
  <section class="card"><div class="stats"><div class="big"><span id="doneCount">0</span><small> / 47県</small></div><div class="bar"><i id="progressBar"></i></div><div id="percent" class="percent">0%</div></div><div id="filters" class="filters"><button class="filter active" data-filter="all">すべて</button><button class="filter" data-filter="visited">行った県</button><button class="filter" data-filter="unvisited">まだの県</button><button class="filter" data-filter="北海道">北海道</button><button class="filter" data-filter="東北">東北</button><button class="filter" data-filter="関東">関東</button><button class="filter" data-filter="中部">中部</button><button class="filter" data-filter="近畿">近畿</button><button class="filter" data-filter="中国">中国</button><button class="filter" data-filter="四国">四国</button><button class="filter" data-filter="九州・沖縄">九州・沖縄</button></div></section>
  <div class="layout"><section class="card map-card"><div class="map-title"><h2>JAPAN COMPLETE MAP</h2><span class="hint">県をタップ</span></div><div id="map" class="japan-map" aria-label="47都道府県地図"></div></section><aside class="card side"><div><h2 id="sideTitle">まだ行っていない県</h2><span class="hint">次の旅先を見つけよう</span></div><div id="nextList" class="next-list"></div></aside></div>
  <div class="credit">この試作は端末内に保存されます。既存の浜松MAP・ROOMデータには影響しません。</div>
</main>
<div id="modal" class="modal" hidden><section class="sheet"><div class="sheet-head"><div><div class="eyebrow" id="regionName">JAPAN</div><h2 id="prefName">静岡県</h2></div><button id="close" class="close" aria-label="閉じる">×</button></div><label class="visited-toggle"><input id="visited" type="checkbox">この県へ行ったことがある</label><div class="form-grid"><div class="field"><label for="year">旅行した年</label><input id="year" inputmode="numeric" maxlength="4" placeholder="例：2026"></div><div class="field"><label for="withWho">誰と行った？</label><input id="withWho" maxlength="30" placeholder="例：家族みんな"></div><div class="field full"><label for="memo">思い出メモ</label><textarea id="memo" maxlength="500" placeholder="楽しかった場所、食べたもの、また行きたい所など"></textarea></div><div class="field full"><label>思い出の写真（任意）</label><label class="photo-pick">📷 カメラまたは端末の写真を選ぶ<input id="photo" type="file" accept="image/*"></label><div id="photoPreview" class="photo-preview" hidden><img id="photoImg" alt="思い出の写真"><button id="removePhoto" class="remove-photo" type="button">写真を外す</button></div></div></div><div class="save-row"><button id="cancel" class="btn">キャンセル</button><button id="save" class="btn primary">記録を保存</button></div></section></div>
<div id="toast" class="toast">保存しました</div>
<div id="celebrate" class="celebrate" hidden><div class="confetti" id="confetti"></div><div><div class="eyebrow">JAPAN COMPLETE</div><b id="celebrateTitle">10県！</b><p id="celebrateText">家族の思い出が日本地図に広がりました。</p><button id="celebrateClose" class="btn">地図を見る</button></div></div>
<script type="module">

import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {getFirestore,doc,collection,setDoc,getDoc,onSnapshot,serverTimestamp,Bytes,deleteField} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBZy-k3B2_Z88qEbwMzWizQXl_RKqP6s9k",authDomain:"uguisu-map.firebaseapp.com",projectId:"uguisu-map",storageBucket:"uguisu-map.firebasestorage.app",messagingSenderId:"785750619735",appId:"1:785750619735:web:fd5d84665aad10720a1512"};
const firebaseApp=initializeApp(firebaseConfig),auth=getAuth(firebaseApp),cloudDb=getFirestore(firebaseApp);
const PREFS=[
['北海道','北海道',570,70],['青森県','東北',525,145],['岩手県','東北',565,195],['宮城県','東北',555,245],['秋田県','東北',500,195],['山形県','東北',500,245],['福島県','東北',515,295],
['茨城県','関東',535,355],['栃木県','関東',480,335],['群馬県','関東',425,335],['埼玉県','関東',465,380],['千葉県','関東',540,410],['東京都','関東',470,425],['神奈川県','関東',445,465],
['新潟県','中部',420,280],['富山県','中部',345,320],['石川県','中部',300,330],['福井県','中部',280,375],['山梨県','中部',400,420],['長野県','中部',390,365],['岐阜県','中部',330,410],['静岡県','中部',385,470],['愛知県','中部',330,465],
['三重県','近畿',290,485],['滋賀県','近畿',265,430],['京都府','近畿',225,420],['大阪府','近畿',220,470],['兵庫県','近畿',175,445],['奈良県','近畿',255,490],['和歌山県','近畿',225,535],
['鳥取県','中国',125,395],['島根県','中国',70,400],['岡山県','中国',130,445],['広島県','中国',75,455],['山口県','中国',30,485],
['徳島県','四国',145,535],['香川県','四国',135,495],['愛媛県','四国',80,525],['高知県','四国',105,570],
['福岡県','九州・沖縄',25,555],['佐賀県','九州・沖縄',-20,585],['長崎県','九州・沖縄',-65,610],['熊本県','九州・沖縄',5,615],['大分県','九州・沖縄',55,590],['宮崎県','九州・沖縄',45,640],['鹿児島県','九州・沖縄',-5,675],['沖縄県','九州・沖縄',585,555]
].map((p,i)=>({code:i+1,name:p[0],region:p[1],x:Math.max(38,Math.min(642,p[2]+75)),y:Math.max(28,Math.min(615,p[3]-40))}));
const COLORS={'北海道':'#6aa7d9','東北':'#8e72bd','関東':'#e46679','中部':'#ef914d','近畿':'#e0bc3f','中国':'#5bad83','四国':'#42a6a1','九州・沖縄':'#4b85bf'};
let records={},localRecords={},activeCode=0,filter='all',pendingPhoto=null,removePhoto=false,photoUrls=[],cloudRoomId='',cloudInviteToken='',cloudRole='',cloudUnsub=null;
const $=s=>document.querySelector(s),dbPromise=openDb();
function openDb(){return new Promise((ok,no)=>{const req=indexedDB.open('japan47-memories',1);req.onupgradeneeded=()=>req.result.createObjectStore('records',{keyPath:'code'});req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}
async function load(){const db=await dbPromise;localRecords=await new Promise((ok,no)=>{const r=db.transaction('records').objectStore('records').getAll();r.onsuccess=()=>ok(Object.fromEntries(r.result.map(x=>[x.code,x])));r.onerror=()=>no(r.error)});records={...localRecords};render()}
async function put(record){const db=await dbPromise;await new Promise((ok,no)=>{const r=db.transaction('records','readwrite').objectStore('records').put(record);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
async function ensureAuth(){if(auth.currentUser)return auth.currentUser;return(await signInAnonymously(auth)).user}
const secureId=bytes=>{const a=new Uint8Array(bytes);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('')};
function roomUrl(roomId){const u=new URL(location.href);u.search='';u.searchParams.set('room',roomId);return u.href}
function inviteUrl(){const u=new URL(location.href);u.search='';u.searchParams.set('invite',cloudInviteToken);return u.href}
function setCloudUi(text){$('#cloudStatus').textContent=text;$('#createRoom').hidden=!!cloudRoomId;$('#shareRoom').hidden=!cloudRoomId||cloudRole!=='MASTER';$('#importLocal').hidden=!cloudRoomId||cloudRole!=='MASTER'||!Object.keys(localRecords).length}
function subscribeCloud(){if(cloudUnsub)cloudUnsub();cloudUnsub=onSnapshot(collection(cloudDb,'completeRooms',cloudRoomId,'progress'),snap=>{const next={};snap.forEach(d=>{const code=Number(d.id),r=d.data();if(code>=1&&code<=47)next[code]={...r,code,visited:!!r.done}});records=next;render();setCloudUi(`家族共有中・${cloudRole==='MASTER'?'MASTER':'PLAYER'}・リアルタイム同期`)},e=>{console.error(e);setCloudUi('共有データの同期に失敗しました')})}
async function createCloudRoom(){const btn=$('#createRoom');btn.disabled=true;setCloudUi('共有ROOMを準備しています…');try{const user=await ensureAuth(),roomRef=doc(collection(cloudDb,'completeRooms'));cloudRoomId=roomRef.id;cloudInviteToken=secureId(24);cloudRole='MASTER';await setDoc(roomRef,{ownerUid:user.uid,title:'家族で旅した日本地図',roomType:'JAPAN_MAP',theme:'日本47都道府県',play:'TOGETHER',size:47,skin:'simple',items:PREFS.map(p=>p.name),inviteToken:cloudInviteToken,createdAt:serverTimestamp(),version:2});await setDoc(doc(cloudDb,'completeRooms',cloudRoomId,'members',user.uid),{role:'MASTER',displayName:'MASTER',joinedAt:serverTimestamp()});await setDoc(doc(cloudDb,'completeInvites',cloudInviteToken),{roomId:cloudRoomId,ownerUid:user.uid,active:true,roomType:'JAPAN_MAP',createdAt:serverTimestamp()});await setDoc(doc(cloudDb,'completeUsers',user.uid,'rooms',cloudRoomId),{role:'MASTER',roomType:'JAPAN_MAP',title:'家族で旅した日本地図',skin:'simple',updatedAt:serverTimestamp()});history.replaceState(null,'',roomUrl(cloudRoomId));records={};subscribeCloud();setCloudUi('家族共有ROOMを作成しました');if(Object.keys(localRecords).length&&confirm('この端末にある記録を家族共有ROOMへ移しますか？'))await importLocalRecords()}catch(e){console.error(e);const msg=e?.code==='permission-denied'?'Firestoreルールの更新が必要です':'共有ROOMを作成できませんでした';setCloudUi(msg);alert(msg)}finally{btn.disabled=false}}
async function resumeCloudRoom(roomId){try{const user=await ensureAuth(),member=await getDoc(doc(cloudDb,'completeRooms',roomId,'members',user.uid)),room=await getDoc(doc(cloudDb,'completeRooms',roomId));if(!member.exists()||!room.exists()||room.data().roomType!=='JAPAN_MAP')throw new Error('invalid-room');cloudRoomId=roomId;cloudRole=member.data().role||'PLAYER';cloudInviteToken=room.data().inviteToken||'';subscribeCloud()}catch(e){console.error(e);alert('この日本地図ROOMを開く権限がありません');history.replaceState(null,'',location.pathname);records={...localRecords};render();setCloudUi('この端末だけの地図です')}}
async function joinInvite(token){try{setCloudUi('招待ROOMへ接続しています…');const user=await ensureAuth(),inviteSnap=await getDoc(doc(cloudDb,'completeInvites',token));if(!inviteSnap.exists()||inviteSnap.data().active!==true)throw new Error('invalid-invite');const invite=inviteSnap.data();if(invite.roomType!=='JAPAN_MAP')throw new Error('invalid-invite');const memberRef=doc(cloudDb,'completeRooms',invite.roomId,'members',user.uid);let memberSnap=null;try{memberSnap=await getDoc(memberRef)}catch{}let role='PLAYER';if(memberSnap?.exists())role=memberSnap.data().role||'PLAYER';else{const displayName=(prompt('この日本地図で使う名前を入力してください')||'参加者').trim().slice(0,20)||'参加者';await setDoc(memberRef,{role:'PLAYER',displayName,inviteToken:token,joinedAt:serverTimestamp()})}await setDoc(doc(cloudDb,'completeUsers',user.uid,'rooms',invite.roomId),{role,roomType:'JAPAN_MAP',title:'家族で旅した日本地図',skin:'simple',updatedAt:serverTimestamp()});cloudRoomId=invite.roomId;cloudInviteToken=token;cloudRole=role;history.replaceState(null,'',roomUrl(cloudRoomId));subscribeCloud()}catch(e){console.error(e);setCloudUi('招待リンクが無効です');alert('この招待リンクは無効です。新しいリンクを送ってもらってください。')}}
async function importLocalRecords(){if(!cloudRoomId||cloudRole!=='MASTER')return;const entries=Object.values(localRecords);if(!entries.length)return toast('移せる端末記録がありません');const btn=$('#importLocal');btn.disabled=true;try{for(let i=0;i<entries.length;i++){const r=entries[i],payload={done:!!r.visited,visited:!!r.visited,year:r.year||'',withWho:r.withWho||'',memo:r.memo||'',updatedName:'MASTER',updatedAt:serverTimestamp()};if(r.photo)payload.photoBytes=Bytes.fromUint8Array(new Uint8Array(await r.photo.arrayBuffer())),payload.contentType='image/jpeg';await setDoc(doc(cloudDb,'completeRooms',cloudRoomId,'progress',String(r.code)),payload,{merge:true});setCloudUi(`端末記録を共有へ移しています… ${i+1}/${entries.length}`)}toast('端末記録を家族共有へ移しました')}catch(e){console.error(e);alert('一部の記録を移せませんでした：'+(e.code||e.message))}finally{btn.disabled=false}}
function render(){photoUrls.forEach(URL.revokeObjectURL);photoUrls=[];const map=$('#map');map.innerHTML=PREFS.map(p=>{const r=records[p.code]||{},dim=(filter==='visited'&&!r.visited)||(filter==='unvisited'&&r.visited)||(!['all','visited','unvisited',p.region].includes(filter));return `<button class="pref ${r.visited?'visited':''} ${r.photo||r.photoBytes?'has-photo':''} ${dim?'dim':''}" data-code="${p.code}" style="left:${p.x}px;top:${p.y}px;--pref-color:${COLORS[p.region]}" aria-label="${p.name}${r.visited?' 訪問済み':''}">${p.name.replace(/[都府県]$/,'')}</button>`}).join('');const done=PREFS.filter(p=>records[p.code]?.visited).length,pct=Math.round(done/47*100);$('#doneCount').textContent=done;$('#percent').textContent=pct+'%';$('#progressBar').style.width=pct+'%';renderSide();}
function renderSide(){let list=PREFS.filter(p=>filter==='visited'?records[p.code]?.visited:filter==='unvisited'?!records[p.code]?.visited:!['all'].includes(filter)?p.region===filter:!records[p.code]?.visited);$('#sideTitle').textContent=filter==='visited'?'行った県の思い出':filter==='all'?'まだ行っていない県':`${filter}の県`;if(filter==='all')list=list.slice(0,12);$('#nextList').innerHTML=list.length?list.map(p=>{const r=records[p.code]||{};return `<button class="next-item ${r.visited?'done':''}" data-code="${p.code}"><span>${r.visited?'✓ ':''}${p.name}</span><small>${r.year||p.region}</small></button>`}).join(''):'<div class="empty">該当する県はありません</div>'}
function photoUrl(blob){if(blob?.toUint8Array)blob=new Blob([blob.toUint8Array()],{type:'image/jpeg'});if(!blob)return'';const u=URL.createObjectURL(blob);photoUrls.push(u);return u}
function openRecord(code){activeCode=Number(code);pendingPhoto=null;removePhoto=false;const p=PREFS[activeCode-1],r=records[activeCode]||{};$('#regionName').textContent=p.region;$('#prefName').textContent=p.name;$('#visited').checked=!!r.visited;$('#year').value=r.year||'';$('#withWho').value=r.withWho||'';$('#memo').value=r.memo||'';const src=photoUrl(r.photo||r.photoBytes);$('#photoPreview').hidden=!src;if(src)$('#photoImg').src=src;$('#photo').value='';$('#modal').hidden=false}
function close(){activeCode=0;pendingPhoto=null;$('#modal').hidden=true}
async function compress(file){const img=await createImageBitmap(file),max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);img.close();let quality=.78,blob;do{blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',quality));quality-=.1}while(blob&&blob.size>600000&&quality>=.38);if(!blob||blob.size>720000)throw new Error('写真を十分に小さくできませんでした。別の写真を選んでください');return blob}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function celebrate(n){if(![1,10,20,30,40,47].includes(n))return;$('#celebrateTitle').textContent=n===47?'47都道府県 COMPLETE!':`${n}県！`;$('#celebrateText').textContent=n===1?'家族の旅の地図が始まりました。':n===47?'日本中が、家族の宝物になりました！':'家族の思い出が日本地図に広がりました。';$('#confetti').innerHTML=Array.from({length:Math.min(90,20+n)},(_,i)=>`<i style="--x:${Math.random()*100}%;--h:${Math.random()*360};--t:${1.5+Math.random()*2}s;--d:${-80+Math.random()*160}px;--r:${Math.random()*180}deg"></i>`).join('');$('#celebrate').hidden=false}
$('#map').addEventListener('click',e=>{const b=e.target.closest('.pref');if(b&&!b.classList.contains('dim'))openRecord(b.dataset.code)});$('#nextList').addEventListener('click',e=>{const b=e.target.closest('[data-code]');if(b)openRecord(b.dataset.code)});$('#filters').addEventListener('click',e=>{const b=e.target.closest('.filter');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#close').onclick=$('#cancel').onclick=close;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});$('#photo').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;toast('写真を軽くしています…');pendingPhoto=await compress(f);removePhoto=false;$('#photoImg').src=URL.createObjectURL(pendingPhoto);$('#photoPreview').hidden=false});$('#removePhoto').onclick=()=>{pendingPhoto=null;removePhoto=true;$('#photoPreview').hidden=true};
$('#save').onclick=async()=>{if(!activeCode)return;const code=activeCode,before=PREFS.filter(p=>records[p.code]?.visited).length,old=records[code]||{},record={...old,code,visited:$('#visited').checked,year:$('#year').value.trim(),withWho:$('#withWho').value.trim(),memo:$('#memo').value.trim(),updatedAt:new Date().toISOString()};if(pendingPhoto)record.photo=pendingPhoto;else if(removePhoto)delete record.photo;const btn=$('#save');btn.disabled=true;btn.textContent='保存中…';try{if(cloudRoomId){const user=await ensureAuth(),payload={done:record.visited,visited:record.visited,year:record.year,withWho:record.withWho,memo:record.memo,updatedBy:user.uid,updatedName:cloudRole==='MASTER'?'MASTER':'参加者',updatedAt:serverTimestamp()};if(pendingPhoto){payload.photoBytes=Bytes.fromUint8Array(new Uint8Array(await pendingPhoto.arrayBuffer()));payload.contentType='image/jpeg'}else if(removePhoto){payload.photoBytes=deleteField();payload.contentType=deleteField()}await setDoc(doc(cloudDb,'completeRooms',cloudRoomId,'progress',String(code)),payload,{merge:true})}else{await put(record);localRecords[code]=record;records[code]=record}close();render();toast('思い出を保存しました');const after=PREFS.filter(p=>records[p.code]?.visited).length;if(after>before)celebrate(after)}catch(e){console.error(e);alert('記録を保存できませんでした：'+(e.code||e.message))}finally{btn.disabled=false;btn.textContent='記録を保存'}};
$('#celebrateClose').onclick=()=>$('#celebrate').hidden=true;
$('#createRoom').onclick=createCloudRoom;
$('#importLocal').onclick=()=>{if(confirm('この端末の記録を家族共有ROOMへ移しますか？'))importLocalRecords()};
$('#shareRoom').onclick=async()=>{const url=inviteUrl();try{await navigator.clipboard.writeText(url);toast('家族招待URLをコピーしました')}catch{prompt('このURLをコピーして家族へ送ってください',url)}};
const blobToData=blob=>new Promise(ok=>{if(blob?.toUint8Array)blob=new Blob([blob.toUint8Array()],{type:'image/jpeg'});if(!blob)return ok('');const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(blob)});const dataToBlob=async data=>data?await(await fetch(data)).blob():null;
$('#backup').onclick=async()=>{const clean=await Promise.all(Object.values(records).map(async({photo,photoBytes,...r})=>({...r,photoData:await blobToData(photo||photoBytes)}))),blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),records:clean})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`japan47-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('写真を含む記録を保存しました')};
$('#restore').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const json=JSON.parse(await file.text());if(!Array.isArray(json.records))throw new Error();if(!confirm(`${json.records.length}県分の記録を復元しますか？`))return;for(const item of json.records){if(!Number.isInteger(Number(item.code))||item.code<1||item.code>47)continue;const {photoData,...record}=item;if(photoData)record.photo=await dataToBlob(photoData);await put(record);records[record.code]=record}render();toast('記録を復元しました')}catch{alert('このバックアップファイルは読み込めません')}finally{e.target.value=''}});
$('#saveImage').onclick=()=>{const c=document.createElement('canvas'),scale=2;c.width=900*scale;c.height=760*scale;const x=c.getContext('2d');x.scale(scale,scale);x.fillStyle='#fffaf1';x.fillRect(0,0,900,760);x.fillStyle='#17232c';x.font='bold 34px serif';x.fillText('家族で旅した日本地図',45,55);const done=PREFS.filter(p=>records[p.code]?.visited).length;x.font='bold 18px sans-serif';x.fillText(`${done} / 47 PREFECTURES`,47,88);PREFS.forEach(p=>{const r=records[p.code]||{},px=p.x+80,py=p.y+45;x.fillStyle=r.visited?COLORS[p.region]:'#fff';x.strokeStyle='#708891';x.lineWidth=2;x.beginPath();x.roundRect(px-32,py-19,64,38,7);x.fill();x.stroke();x.fillStyle=r.visited?'#fff':'#364850';x.font='bold 11px sans-serif';x.textAlign='center';x.fillText(p.name.replace(/[都府県]$/,''),px,py+4)});x.textAlign='left';x.fillStyle='#66727a';x.font='12px sans-serif';x.fillText('ENJOY YOUR LIFE. / JAPAN 47 COMPLETE MAP',45,730);const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.92);a.download=`家族で旅した日本地図-${new Date().toISOString().slice(0,10)}.jpg`;a.click();toast('地図画像を保存しました')};
async function boot(){try{await load()}catch(e){console.error(e);alert('端末への保存機能を開始できませんでした')}const q=new URLSearchParams(location.search),invite=q.get('invite'),room=q.get('room');if(invite)await joinInvite(invite);else if(room)await resumeCloudRoom(room);else setCloudUi('この端末だけの地図です')}
boot();
</script>
